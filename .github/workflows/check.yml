name: check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subset scope notice
        run: echo "::notice::此 CI 仅跑静态子集检查（约 6 项），非全量 make check（13 项）。完整体检需在本地或装有 API key 的 self-hosted runner 上跑。"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Install npm deps
        run: |
          npm install

      - name: Makefile syntax check
        run: make help

      - name: tui.json / opencode.json plugin 同步检查
        run: make tui-sync

      - name: JSON 语法验证
        run: |
          for f in opencode.json tui.json package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1
            echo "✓ $f 语法正确"
          done

      # 注：OMO 配置（~/.omo/omo.jsonc）不在仓库内（4.19.4+ 迁移），CI 无法校验；
      # schema 文件随 npm 包发布已自校验，项目侧无需重复

      - name: skills.lock 存在性验证
        run: |
          test -s skills.lock && echo "✓ skills.lock 存在且非空（$(wc -l < skills.lock) 条）" || {
            echo "❌ skills.lock 缺失或为空（运行 make skills-lock 生成）"
            exit 1
          }

      - name: skills.lock 格式校验
        run: |
          # 每行必须匹配：<64-hex>  <name>/SKILL.md
          BAD=$(awk '!/^[a-f0-9]{64}  [a-z0-9_-]+\/SKILL\.md$/ {print NR": "$0}' skills.lock)
          if [ -n "$BAD" ]; then
            echo "❌ skills.lock 格式错误（应：<64hex>  <name>/SKILL.md）："
            echo "$BAD"
            exit 1
          fi
          echo "✓ skills.lock 格式正确（$(wc -l < skills.lock) 条，每行 <hash>  <name>/SKILL.md）"

      # 注：完整 make check 在 CI 环境会因缺 API key 而警告，所以只跑上面的子集
